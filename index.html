<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlow - Study Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --bg: #0f172a;
            --surface: rgba(30, 41, 59, 0.7);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-green: #10b981;
            --accent-orange: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* Top Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--primary-gradient);
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 20px;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #334155;
            border: 2px solid var(--primary);
            display: grid;
            place-items: center;
            font-size: 14px;
        }

        /* Hero Banner */
        .hero-card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 100px; height: 100px;
            background: var(--primary-gradient);
            filter: blur(50px);
            opacity: 0.4;
        }

        .hero-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #e2e8f0;
        }

        .hero-sub {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 16px;
        }

        .progress-box {
            background: rgba(15, 23, 42, 0.6);
            padding: 12px 16px;
            border-radius: 16px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 35%;
            background: var(--primary-gradient);
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
        }

        /* Quick Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            padding: 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 20px;
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* Section Title & Action Button */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .btn-add {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            cursor: pointer;
        }

        /* Task Cards */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-card {
            background: var(--surface);
            backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border);
            padding: 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.2s ease;
        }

        .task-card:active {
            transform: scale(0.98);
        }

        .task-check {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            border: 2px solid #475569;
            display: grid;
            place-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-card.done .task-check {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .task-card.done .task-name {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .task-info {
            flex-grow: 1;
        }

        .task-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge-subject {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }

        .badge-date {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        /* Bottom Nav Bar - Mobile Perfect Style */
        .bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 440px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 8px 16px;
            border-radius: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            z-index: 999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 14px;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .nav-icon {
            font-size: 18px;
        }

        /* Custom Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="toast" class="toast">✨ ทำการบันทึกข้อมูลเรียบร้อย!</div>

    <div class="container">
        <!-- Top Header -->
        <header class="header">
            <div class="brand-logo">
                <div class="logo-icon">🎓</div>
                <div class="brand-name">EduFlow</div>
            </div>
            <div class="user-avatar">⚡</div>
        </header>

        <!-- Hero Card -->
        <section class="hero-card">
            <div class="hero-title">สวัสดีครับ! 👋 มาเก็บงานวันนี้กัน</div>
            <div class="hero-sub">เหลือการบ้านที่ต้องส่งอีก 3 รายการ</div>
            
            <div class="progress-box">
                <div class="progress-info">
                    <span>ความก้าวหน้าโดยรวม</span>
                    <span id="percent-text">33%</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>
        </section>

        <!-- Quick Stats -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(245, 158, 11, 0.15); color: #f59e0b;">⏳</div>
                <div>
                    <div class="stat-val" id="count-pending">2</div>
                    <div class="stat-lbl">ค้างส่ง</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.15); color: #10b981;">✅</div>
                <div>
                    <div class="stat-val" id="count-done">1</div>
                    <div class="stat-lbl">เสร็จแล้ว</div>
                </div>
            </div>
        </section>

        <!-- Tasks Section -->
        <section>
            <div class="section-header">
                <div class="section-title">รายการงานที่ต้องทำ</div>
                <button class="btn-add" onclick="addNewTask()">+ เพิ่มการบ้าน</button>
            </div>

            <div class="task-list" id="task-container">
                <!-- Task Items Rendered by JS -->
            </div>
        </section>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <span class="nav-icon">📊</span>
            <span>แดชบอร์ด</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">📌</span>
            <span>คันบัง</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">📅</span>
            <span>ตารางเรียน</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">⏱️</span>
            <span>จับเวลา</span>
        </a>
    </nav>

    <script>
        // Task Data
        let tasks = JSON.parse(localStorage.getItem('eduflow_modern_tasks')) || [
            { id: 1, title: 'ส่งรายงานวิชาภาษาไทย', subject: 'ภาษาไทย', date: 'พรุ่งนี้', done: false },
            { id: 2, title: 'ทำแบบฝึกหัดคณิตศาสตร์', subject: 'คณิตศาสตร์', date: 'ส่งแล้ว', done: true },
            { id: 3, title: 'เก็งข้อสอบภาษาอังกฤษ', subject: 'อังกฤษ', date: 'อีก 3 วัน', done: false }
        ];

        function showNotification(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2000);
        }

        function renderTasks() {
            const container = document.getElementById('task-container');
            container.innerHTML = '';

            let doneCount = 0;

            tasks.forEach(task => {
                if (task.done) doneCount++;

                const el = document.createElement('div');
                el.className = `task-card ${task.done ? 'done' : ''}`;
                el.innerHTML = `
                    <div class="task-check" onclick="toggleTask(${task.id})">
                        ${task.done ? '✓' : ''}
                    </div>
                    <div class="task-info">
                        <div class="task-name">${task.title}</div>
                        <div class="task-meta">
                            <span class="badge badge-subject">${task.subject}</span>
                            <span class="badge-date">🕒 ${task.date}</span>
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });

            // Update Stats & Progress
            const total = tasks.length;
            const percent = total === 0 ? 0 : Math.round((doneCount / total) * 100);

            document.getElementById('count-done').textContent = doneCount;
            document.getElementById('count-pending').textContent = total - doneCount;
            document.getElementById('percent-text').textContent = percent + '%';
            document.getElementById('progress-fill').style.width = percent + '%';

            localStorage.setItem('eduflow_modern_tasks', JSON.stringify(tasks));
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
            renderTasks();
            showNotification('อัปเดตสถานะงานเรียบร้อย!');
        }

        function addNewTask() {
            const title = prompt('กรุณากรอกชื่อการบ้าน/งานที่ต้องทำ:');
            if (title && title.trim() !== '') {
                const subject = prompt('ชื่อวิชา (เช่น ภาษาไทย, ฟิสิกส์):') || 'ทั่วไป';
                tasks.unshift({
                    id: Date.now(),
                    title: title.trim(),
                    subject: subject,
                    date: 'เร็วๆ นี้',
                    done: false
                });
                renderTasks();
                showNotification('✨ เพิ่มงานใหม่สำเร็จ!');
            }
        }

        // Initial Render
        renderTasks();
    </script>
</body>
    </html>
