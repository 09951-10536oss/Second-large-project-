<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlow - Dashboard</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/dark-theme.css">
</head>
<body>
    <div id="app" class="app-container">
        <header class="top-nav">
            <div class="brand">🎓 EduFlow</div>
            <nav class="nav-links">
                <a href="index.html" class="active">แดชบอร์ด</a>
                <a href="kanban.html">คันบัง</a>
                <a href="schedule.html">ตารางเรียน</a>
                <a href="pomodoro.html">จับเวลา</a>
                <a href="analytics.html">สถิติ</a>
            </nav>
            <button id="theme-toggle" class="btn-secondary">🌙</button>
        </header>
        <main class="main-content">
            <section class="welcome-card">
                <h2>สวัสดี! มาลุยการเรียนวันนี้กัน 🚀</h2>
                <div class="progress-bar-bg"><div id="total-progress" class="progress-bar-fill" style="width: 0%"></div></div>
                <p>ความก้าวหน้ารวม: <span id="progress-percent">0%</span></p>
            </section>
            <section class="task-section">
                <div class="section-header">
                    <h3>รายการงานล่าสุด</h3>
                    <button class="btn-primary" onclick="openAddTaskModal()">+ เพิ่มงาน</button>
                </div>
                <div id="task-list" class="task-grid"></div>
            </section>
        </main>
    </div>
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/mockData.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
